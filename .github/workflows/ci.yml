name: ci

# This repo had no CI at all. It builds the corpus den-atlas serves and the app searches, so a
# change that breaks assembly or publishing was previously discovered by running the pipeline by
# hand — or by the box picking up a bad release.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The shell scripts are the half that actually runs in production: they drive enrichment, the
  # delta pass, the corpus embed, and the publish that den-atlas's sync consumes. `sh -n` is a
  # floor, not a test suite — it catches the syntax error that would otherwise surface as a failed
  # nightly run — and shellcheck catches the quoting mistakes that have bitten the sibling repos.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # den-spec holds the store-v1 fixture. This repo WRITES that format, and the round-trip test below
      # rebuilds the fixture with the real writer and requires it byte-identical — so without den-spec
      # that test fails rather than skips, the same way den-core's and den-atlas's readers do.
      - uses: actions/checkout@v7
        with:
          repository: oxyc/den-spec
          path: den-spec-checkout
      - name: Parse under dash
        run: |
          for f in pipeline/*.sh lib/*.sh; do
            head -1 "$f" | grep -q bash && sh="bash" || sh="dash"
            "$sh" -n "$f" || exit 1
            echo "ok  $f ($sh)"
          done
      # Pinned to a commit, not @master: a mutable third-party ref runs whatever that branch holds at the
      # moment CI fires, and the `actions` dependabot group below can bump a pinned SHA but not a branch.
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
        with:
          scandir: .
          ignore_paths: den-spec-checkout
          severity: warning
      - name: Python worklist builder
        run: |
          python3 -m py_compile pipeline/build_worklist.py
          python3 -m unittest pipeline/build_worklist_test.py
      # The embed path, which runs from a container on the box with nothing installed: these must stay
      # importable on a bare python3, because a syntax error there surfaces as a failed corpus run hours in.
      - name: The embed path compiles
        run: python3 -m py_compile pipeline/embed_canary.py pipeline/embed_docs.py pipeline/embed_premise_v2.py pipeline/import_box_vectors.py
      - name: Jev facet contracts
        run: |
          python3 -m py_compile pipeline/run_facets.py pipeline/run_combined.py pipeline/run_delta.py pipeline/audit_combined.py pipeline/consolidate_corpus.py
          # The auditor is included deliberately: it is the only thing standing between a corrupted bundle
          # and a published dataset, and the pass it audits cost $20.47 and will not be run again.
          python3 -m unittest pipeline/run_facets_test.py pipeline/run_combined_test.py pipeline/audit_combined_test.py pipeline/run_delta_test.py lib/typesafe_client_test.py
      # The committed genres & moods (`data/genres-moods-curated.json`) and the one-off that seeded them. The
      # file itself is gated against the baseline by `pipeline/eval_taxonomy_test.py` below.
      - name: Genres & moods seed
        run: python3 -m unittest pipeline/seed_genres_moods_curated_test.py
      # The hand enrichment that writes into that file (`./den genres-moods prepare|merge`): what it selects,
      # the batches and validator the agents get, July's assemble thresholds, and that a merge keeps the
      # file's bytes, refuses a result past the tolerance and never lowers the baseline on its own.
      - name: Genres & moods enrichment
        run: python3 -m unittest pipeline/genres_moods_enrich_test.py
      # The publish path. Nothing tested any of it until now, and it is the half that decides what the box
      # is allowed to serve: the store writer against den-spec's fixture, and the record-count guard that
      # refuses a silent shrink.
      #
      # The embedding-space canary belongs here for the same reason: it decides what is allowed to become
      # a vector. It is also the only test that pins the committed `data/embed-canary.json` — its two
      # digests, and that its cases still cover a query, a non-Latin text, the corpus document shape and
      # a text past the token cap.
      - name: The publisher's guards
        run: python3 -m unittest pipeline/build_store_test.py pipeline/manifest_counts_test.py pipeline/check_filename_version_test.py pipeline/check_producers_test.py pipeline/prune_manifest_test.py pipeline/sign_manifest_test.py pipeline/consolidate_corpus_test.py pipeline/eval_taxonomy_test.py pipeline/embed_canary_test.py pipeline/check_plot_invariants_test.py pipeline/backfill_plot_provenance_test.py pipeline/recluster_test.py
        env:
          DEN_SPEC_DIR: ${{ github.workspace }}/den-spec-checkout
      # The ranking metrics. `tools/rulers/reco_metrics.py` is what `score_reco.py` scores a ranking change
      # with, and every case it pins is a place a reimplementation drifts quietly: the capped ideal, the
      # min() in average precision, "not measurable" diversity, unknown ids skipped for novelty, and the
      # gate's rule that a tie fails. Its suite was in no CI step and errored on import, so none of that
      # was checked by anything.
      - name: The ranking metrics
        run: python3 -m unittest tools/rulers/reco_metrics_test.py
      # Appending a premise generation run to the committed `data/premise-tags-v2.json`: the repairs apply,
      # a key already there is refused, and the file's metadata and formatting survive.
      - name: The premise tags merge
        run: python3 -m unittest pipeline/merge_premise_tags_test.py
      # The pipeline skeleton (oxyc/den-dataset#27): the stage contract, the artifact catalogue, the
      # producer registry derived from the stage order, the corpus, embed and store stages against the
      # rules they wrap, and `den`.
      #
      # The embed stage runs here against a den-embed stand-in on a local port — its gates, its resume and
      # its tear repair — and its composer against documents the Swift composer wrote. What cannot run here
      # is the real model; that is what the committed canary checks on every run. The worklist stage's
      # oracle is out for the toolchain, and a 28 MB daily dump from files.tmdb.org.
      #
      # `lib/` is tested here rather than beside a stage because two stages share it, and because its
      # cache key is a CONTRACT with 2.1 GB of bodies already on disk: `lib/cache_test.py` pins a
      # digest that names a real file under `.cache/`, so a derivation that drifts fails here rather than
      # silently re-fetching the whole corpus.
      #
      # The classify stage's cannot be byte comparison at all: a provider answers the rows and each one
      # carries a fresh run id, so what runs here is the pass's own configuration hash — a manifest built
      # from the documented command's arguments, which a run the stage launches must accept unchanged —
      # plus the `--plan` dry run, which IS deterministic and is compared byte for byte.
      #
      # The genres & moods stage runs against the same provider stubbed out: which titles it asks, what
      # the state carries, that a second run buys nothing, what `data/genres-moods-rule.json` derives, and
      # that a result below the quality baseline is refused rather than written. It also pins the question
      # set's digest — the thresholds in that rule were fitted on the answers to exactly those questions.
      #
      # The enrichment is Python (`pipeline/enrich.py`, `lib/plot.py`). Its equivalence with the Swift pass
      # was a one-off replay — the merge-base binary and the port over out-repass worklists, on a scratch
      # copy of the response cache with the network denied — and cannot run here: CI has no cache. What
      # runs here is each rule on its own against stubbed upstreams, the batch file's bytes against the
      # Swift encoder's captured output, and the drain loop's stopping rules.
      #
      # The franchises stage (oxyc/den-atlas#92) runs against Wikidata and the provider stubbed out: what
      # Wikidata alone decides (a series nested in one root, with its children as eras), which titles are
      # asked and the candidate list each is sent, that a second run buys nothing, that an answer is used
      # only under the candidates it was asked with, and that a result below the golden set's floors is
      # refused rather than written.
      #
      # `store/format_test.py` holds the two fixed-point encoders' refusals. Deleting either one leaves a
      # store that passes every structural guard and quietly rounds the values it ships, which is the loss
      # that already shipped once — so the refusal itself has to be asserted, not just the layout.
      #
      # `guards/reachable_test.py` is the one that matters over time. `scripts/v2/` existed because
      # "delete what nothing runs" was a habit, and a habit loses to a branch someone might come back
      # to; this fails the build on a module under `pipeline/` that no stage reaches, on one under
      # `store/` that the writer the store stage runs does not reach, on a tool under `tools/` or a shell
      # script that nothing that runs reaches and `guards/operator-tools.json` does not declare, and on a
      # Python or shell file anywhere else.
      - name: The pipeline
        run: python3 -m unittest pipeline/contract_test.py pipeline/artifacts_test.py pipeline/worklist_test.py pipeline/fetch_test.py pipeline/refresh_test.py pipeline/changes_test.py pipeline/enrich_test.py pipeline/floors_test.py pipeline/articles_test.py pipeline/classify_test.py pipeline/critique_test.py pipeline/genres_moods_test.py pipeline/franchise_groups_test.py pipeline/franchises_test.py pipeline/docfacts_test.py pipeline/compose_test.py pipeline/embed_test.py pipeline/finalize_test.py pipeline/facts_test.py pipeline/corpus_test.py pipeline/store_test.py pipeline/publish_test.py store/build_test.py store/format_test.py lib/http_test.py lib/cache_test.py lib/tmdb_test.py lib/wikipedia_test.py lib/wikidata_test.py lib/wikidata_facts_test.py lib/plot_test.py lib/enterprise_test.py lib/denembed_test.py guards/reachable_test.py den_test.py
      # The stages above are tested one at a time; this runs them IN ORDER, so what one writes is what the
      # next reads (oxyc/den-dataset#27, acceptance item 1). `den run` over the fixture corpus in
      # `pipeline/fixture-corpus/`, with Wikipedia and Wikidata answered from that directory and TMDB refused,
      # den-embed a stand-in on a local port, and every other connection refused — offline end to end. It
      # asserts that `den run`, given no dataset version, runs every stage but the two that buy or publish,
      # the six inputs no stage produces yet (seeded by hand, and failing here the day a stage produces one),
      # and that the store, the manifest and the facts agree on every count.
      # The plot translator (oxyc/den-dataset#89) keeps torch out of the pipeline, so what runs here is its
      # stdlib half: which plots it extracts, how it splits and rejoins them, the shard plan and the resume.
      - name: The plot translator
        run: python3 -m unittest tools/translate/translate_test.py
      - name: den run, end to end
        run: python3 -m unittest den_run_test.py den_daily_test.py
      # The publisher ITSELF, end to end against a fixture manifest and out-dir with `gh` stubbed. The
      # guards above are the pieces; this is whether the script wires them up — that it refuses a wrong
      # hash, a missing blob, a dropped key, a shrunk count and a blob from a dead generation, and that
      # the happy path still publishes blobs before the meta.
      - name: The publisher itself
        run: bash pipeline/publish-dataset.test.sh
      # And the same cases again through `den stage publish`. The publish stage's output is a release, so
      # there is no artifact to diff it against the hand-typed command the way the corpus and store stages
      # are diffed; running every refusal through the wrapper is what proves it did not swallow one.
      - name: The publisher, through the stage
        run: DEN_PUBLISH_VIA=stage bash pipeline/publish-dataset.test.sh
      # And a third time through `--check`, the gates an unattended run ends on (oxyc/den-dataset#27): each
      # case checked, then published, and the two verdicts held equal — so `--check` cannot pass what a
      # publish would refuse, and uploads nothing.
      - name: The publisher, checking only
        run: DEN_PUBLISH_VIA=check bash pipeline/publish-dataset.test.sh

  ci-ok:
    # One required status check. `always()` so a skipped job does not fail branch protection.
    needs: [scripts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          results='${{ needs.scripts.result }}'
          echo "results: $results"
          for r in $results; do
            case "$r" in failure|cancelled) echo "a required job failed"; exit 1 ;; esac
          done
          echo "ci-ok"
