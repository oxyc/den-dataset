name: daily

# The daily job (oxyc/den-dataset#27): one day of the pipeline, started from what the live dataset was
# published with, ending at "ready to publish". It runs `./den daily` and nothing else — what a day is, which stage a
# missing credential skips and what it refuses to buy are in `pipeline/daily.py`, and `den_daily_test.py` runs
# the same command over the fixture corpus in CI. The weekly run adds a rolling slice of older titles.
#
# NOTHING IS SIGNED OR PUBLISHED HERE. The signing key lives only on the owner's machine. A ready run uploads
# the store, the manifest, `checked.json` and the bundle the next day starts from as an artifact, and `docs/OPERATE.md` ("Publishing a daily run")
# is the one command that signs and publishes those bytes.
#
# OFF UNTIL SWITCHED ON: the schedule runs only when the repository variable DEN_DAILY_ENABLED is `true`, so
# merging this starts nothing. What it reads, all by name and none required:
#
#   secrets  TMDB_API_KEY                       the delta worklist; without it no new titles are discovered
#            TYPESAFE_API_KEY                   the classify, critique and genres & moods answers (with spend)
#            WIKIMEDIA_ENTERPRISE_USERNAME/_PASSWORD   optional plot source
#            DEN_EMBED_URL                      a den-embed to embed against instead of the job's own
#   vars     DEN_DAILY_ENABLED                  `true` to run on the schedule
#            DEN_DAILY_SPEND                    `true` to let the scheduled run buy the day's answers
#            DEN_DAILY_RUNS_ON                  a JSON runner label list, e.g. ["self-hosted","den"]; default
#                                               ubuntu-latest
#            DEN_REVISIT_WEEKS                  the weekly slice's cycle, default 8
#            DEN_EMBED_IMAGE                    the den-embed image the box serves, by digest: the job runs it
#                                               at MAX_TOKENS=1024 and the canary checks its space before a
#                                               vector is written. Without it (and DEN_EMBED_URL) nothing is
#                                               embedded
#
# IT KEEPS NOTHING BETWEEN RUNS. Each run starts in an empty out-dir from what the live dataset's publish put
# beside it: the manifest on `data-latest` and the bundle on `corpus-<its version>` (`pipeline/published.py`
# says what that is and how a day is seeded from it). Nothing from a run is cached or saved; what it bought
# reaches the next day only by being published.
on:
  schedule:
    - cron: "23 3 * * *"   # daily
    - cron: "47 4 * * 1"   # weekly: the daily run plus this week's revisit slice
  workflow_dispatch:
    inputs:
      revisit_weeks:
        description: "Revisit this week's slice of an N-week cycle (empty: no slice)"
        required: false
        default: ""
      spend:
        description: "Buy the day's classify, critique and genres & moods answers"
        type: boolean
        default: false

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' || vars.DEN_DAILY_ENABLED == 'true'
    runs-on: ${{ fromJSON(vars.DEN_DAILY_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 360
    env:
      OUT: out
      DEN_CACHE_DIR: .cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The live manifest, and the bundle its publish put on `corpus-<version>`. Public, read with the job's
      # own token. Without either there is nothing to start from, and a day never starts from nothing: that
      # is a whole generation, bought at once (docs/OPERATE.md, "Where a day starts").
      - name: The live dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUT/published"
          gh release download data-latest -R "$GITHUB_REPOSITORY" -p dataset.meta.json -D "$OUT/published"
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["datasetVersion"])' \
                     "$OUT/published/dataset.meta.json")"
          gh release download "corpus-$version" -R "$GITHUB_REPOSITORY" -D "$OUT/published" \
            || { echo "error: no corpus-$version release: the live dataset was published without its bundle" >&2; exit 1; }
      # The same image at the same token cap gives the box's vectors byte for byte on a hosted runner (#27);
      # the embed stage's canary refuses before writing one if it does not.
      - name: den-embed
        if: vars.DEN_EMBED_IMAGE != ''
        env:
          IMAGE: ${{ vars.DEN_EMBED_IMAGE }}
        run: |
          docker run -d --name den-embed -p 127.0.0.1:8080:8080 -e MAX_TOKENS=1024 "$IMAGE"
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8080/health && exit 0
            sleep 5
          done
          docker logs den-embed >&2; exit 1
      - name: The day
        id: day
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          WIKIMEDIA_ENTERPRISE_USERNAME: ${{ secrets.WIKIMEDIA_ENTERPRISE_USERNAME }}
          WIKIMEDIA_ENTERPRISE_PASSWORD: ${{ secrets.WIKIMEDIA_ENTERPRISE_PASSWORD }}
          DEN_EMBED_URL: ${{ secrets.DEN_EMBED_URL || (vars.DEN_EMBED_IMAGE != '' && 'http://127.0.0.1:8080' || '') }}
          WEEKS: ${{ github.event_name == 'workflow_dispatch' && inputs.revisit_weeks || (github.event.schedule == '47 4 * * 1' && (vars.DEN_REVISIT_WEEKS || '8') || '') }}
          # format() so a dispatch's `false` is a non-empty string and is not replaced by the schedule's variable.
          SPEND: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.spend) || format('{0}', vars.DEN_DAILY_SPEND == 'true') }}
        run: |
          args=(--out-dir "$OUT")
          [ -n "$WEEKS" ] && args+=(--revisit-weeks "$WEEKS")
          [ "$SPEND" = "true" ] && args+=(--spend)
          ./den daily "${args[@]}"
      - name: Report
        if: always()
        run: |
          [ -f "$OUT/daily-report.md" ] && cat "$OUT/daily-report.md" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$OUT" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          path = os.path.join(sys.argv[1], "checked.json")
          print("store=" + (json.load(open(path))["storeFile"] if os.path.exists(path) else ""))
          PY
        id: report
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-report-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/daily-report.json
            ${{ env.OUT }}/daily-report.md
            ${{ env.OUT }}/changes/plan.json
          if-no-files-found: ignore
          retention-days: 30
      # Ready to publish: the exact bytes every gate passed, and the record `--checked` holds them to.
      - name: Upload the dataset, ready to publish
        if: steps.day.outcome == 'success' && steps.report.outputs.store != ''
        uses: actions/upload-artifact@v7
        with:
          name: dataset-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/${{ steps.report.outputs.store }}
            ${{ env.OUT }}/dataset.meta.json
            ${{ env.OUT }}/checked.json
            ${{ env.OUT }}/bundle/
          if-no-files-found: error
          retention-days: 14
