# Weekly dependency PRs, grouped so a refresh is one reviewable PR rather than several.
#
# There is deliberately NO `swift` entry. This package declares no external dependencies — every target is
# local — so SwiftPM writes no Package.resolved, and dependabot's Swift support resolves from that file:
# with none, the update job ERRORS every week rather than sitting quiet. A recurring red job is worse than
# no entry, so add one alongside the first real dependency, when there is a manifest to read.
#
# The artifacts this repo consumes and produces are pinned by other means and dependabot has no
# ecosystem for them: the corpus is embedded through den-embed (whose ONNX Runtime version changes
# vector output — see den-embed's CLAUDE.md), and the published release is consumed by den-atlas's
# sync. Those couplings are documented in docs/, not here, because nothing can automate them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
